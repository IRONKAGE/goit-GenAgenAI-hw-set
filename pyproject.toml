[project]
name = "goit-genagenai-hw-set"
version = "1.0.0"
description = "Monorepo for Generative and Agentic AI projects (Neoversity MSc Portfolio, Nov 2026)"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    # ==========================================
    # 1. LLM Orchestration & Agentic Frameworks (LangChain v1 Standard, Nov 2026)
    # ==========================================
    "langchain==1.5.0",
    "langchain-core==1.8.1",
    "langchain-openai==1.8.0",
    "langchain-chroma==1.1.0",
    "langchain-text-splitters==1.1.3",
    "langchain-tavily==0.2.15",
    "langchain-community==0.4.0",
    "langgraph==1.2.22",
    "langsmith==0.14.17",
    "openai==3.51.0",
    "chromadb==1.5.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-dotenv==1.2.4",

    # ==========================================
    # 2. Data Processing, Web Scraping & Excel Enrichment
    # ==========================================
    "polars==1.44.2",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "numpy==1.26.4",
    "scipy==1.16.3",
    "scikit-learn==1.9.1",
    "openpyxl==3.1.5",
    "tabulate==0.9.0",
    "beautifulsoup4==4.13.5",
    "wikipedia==1.4.0",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "pyyaml==6.0.3",

    # ==========================================
    # 3. Visualization & Reactive UI Frameworks (Marimo 0.25.2)
    # ==========================================
    "marimo==0.25.2",
    "plotly==7.1.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "ruff==0.16.10",

    # ==========================================
    # 4. LLMOps: Tracking, QA & Model Serving
    # ==========================================
    "mlflow==3.16.1",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pytest==9.1.1",

    # ==========================================
    # 5. Deep Learning & Local Inference Hardware Routing
    # ==========================================
    # ⚠️ АРХІТЕКТУРНЕ РІШЕННЯ 1: Маршрутизація PyTorch
    # Для Apple Silicon, Windows та Linux встановлюється найновіша версія (2.14.1)
    "torch==2.14.1 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Для Legacy-систем macOS на базі Intel (x86_64) встановлюється стабільна 2.2.2
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",

    # ⚠️ АРХІТЕКТУРНЕ РІШЕННЯ 2: Маршрутизація ONNX Runtime (для ChromaDB)
    # Для Apple Silicon, Windows та Linux встановлюється 1.32.0
    "onnxruntime==1.32.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Для macOS на базі Intel (x86_64) фіксуємо останній реліз з підтримкою universal2/x86_64
    "onnxruntime==1.19.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",

    "transformers==5.0.0",
    "safetensors==0.8.0",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.10",
    "pytest==9.1.1",
]

[tool.uv]
managed = true
# Гарантує, що uv перевіряє наявність скомпільованих коліс (.whl) для macOS Intel x86_64
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 119
target-version = "py312"
